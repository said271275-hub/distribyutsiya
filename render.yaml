databases:
  - name: distribyutsiya-db
    databaseName: distribyutsiya
    user: distribyutsiya
    plan: free

services:
  - type: web
    name: distribyutsiya-backend
    runtime: python
    rootDir: backend
    buildCommand: bash ./render-build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: distribyutsiya-db
          property: connectionString
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "None"
      - key: DJANGO_ALLOWED_HOSTS
        value: distribyutsiya-backend.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://distribyutsiya.vercel.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://distribyutsiya-backend.onrender.com
      - key: OTP_PROVIDER
        value: apps.accounts.sms.EskizOtpProvider
      - key: ESKIZ_EMAIL
        value: placeholder@example.com
      - key: ESKIZ_PASSWORD
        value: placeholder_password
      - key: ESKIZ_FROM
        value: "4546"

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN.TLD;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN.TLD;

    ssl_certificate /etc/letsencrypt/live/DOMAIN.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN.TLD/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;

    root /srv/distribyutsiya/frontend/dist;
    index index.html;

    location ~ ^/api/auth/(login|staff/login|register|restore)(/otp)?/$ {
        limit_req zone=distribyutsiya_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/distribyutsiya-proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/distribyutsiya-proxy-headers.conf;
    }

    location = /admin {
        include /etc/nginx/snippets/distribyutsiya-admin-allowlist.conf;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/distribyutsiya-proxy-headers.conf;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/distribyutsiya-admin-allowlist.conf;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/distribyutsiya-proxy-headers.conf;
    }

    location /static/ {
        alias /srv/distribyutsiya/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/distribyutsiya/shared/media/;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/distribyutsiya-access.log distribyutsiya_safe;
}
